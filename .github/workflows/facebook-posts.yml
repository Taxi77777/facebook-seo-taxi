name: Facebook SEO Auto-Post - Taxi Marne-la-Vallee

on:
  schedule:
    # Publie tous les jours à 7h, 12h et 18h (heure Paris = UTC+2)
    - cron: '0 5 * * *'   # 7h Paris
    - cron: '0 10 * * *'  # 12h Paris
    - cron: '0 16 * * *'  # 18h Paris
  workflow_dispatch: # Permet de lancer manuellement

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Post to Facebook
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python post_facebook.py
